<style>
  /* =====================================================
     DIGITALMENTE PRO — PORTADA
     PC: imagen completa, centrada y ajustada al alto de pantalla
     Móvil: mantiene el diseño actual que ya te gustó
     ===================================================== */

  .dp-hero {
    width: 100%;
    background: #fffaf6;
  }

  .dp-hero__wrap {
    width: 100%;
    overflow: hidden;
  }

  .dp-hero__media {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 24px 26px;
  }

  .dp-hero__frame {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }

  .dp-hero__image {
    display: block;

    /* PC: que la portada completa entre en pantalla */
    width: auto;
    max-width: 100%;
    max-height: calc(100vh - 150px);
    height: auto;

    object-fit: contain;
    object-position: center;

    transform-origin: center center;

    animation:
      heroReveal 0.9s ease-out both,
      heroFloatZoom 14s ease-in-out 1s infinite alternate;

    will-change: transform, opacity;
  }

  .dp-hero__cta {
    position: absolute;
    right: clamp(14px, 2.2vw, 30px);
    bottom: clamp(14px, 2vw, 26px);

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 42px;
    padding: 0 18px;

    border: 1px solid rgba(255, 255, 255, 0.48);
    border-radius: 999px;

    background: rgba(255, 106, 19, 0.90);
    color: #ffffff;

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Arial,
      sans-serif;

    font-size: 13px;
    font-weight: 800;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;

    box-shadow: 0 9px 22px rgba(75, 34, 12, 0.17);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    opacity: 0;

    animation:
      ctaReveal 0.8s ease-out 0.5s forwards,
      ctaFloat 3.6s ease-in-out 1.5s infinite;

    transition:
      transform 0.2s ease,
      background 0.2s ease,
      box-shadow 0.2s ease;
  }

  .dp-hero__cta:hover {
    background: #f45f08;
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 13px 28px rgba(75, 34, 12, 0.23);
  }

  .dp-hero__cta:focus-visible {
    outline: 3px solid rgba(255,255,255,0.95);
    outline-offset: 3px;
  }

  /* =====================================================
     ANIMACIONES
     ===================================================== */

  @keyframes heroReveal {
    from {
      opacity: 0;
      transform: scale(1.015) translateY(10px);
    }

    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  @keyframes heroFloatZoom {
    0% {
      transform: scale(1) translateY(0);
    }

    100% {
      transform: scale(1.015) translateY(-3px);
    }
  }

  @keyframes ctaReveal {
    from {
      opacity: 0;
      transform: translateY(12px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes ctaFloat {
    0%,
    100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-3px);
    }
  }

  /* =====================================================
     NOTEBOOK / TABLET GRANDE
     ===================================================== */

  @media (max-width: 1180px) and (min-width: 651px) {
    .dp-hero__media {
      padding: 16px 20px 22px;
    }

    .dp-hero__image {
      max-height: calc(100vh - 135px);
    }

    .dp-hero__cta {
      min-height: 40px;
      padding: 0 16px;
      font-size: 12.5px;
    }
  }

  /* =====================================================
     MÓVIL
     Se mantiene grande como ya estaba, porque ahí te gustó.
     ===================================================== */

  @media (max-width: 650px) {
    .dp-hero__media {
      display: block;
      padding: 0;
    }

    .dp-hero__frame {
      display: block;
      width: 100%;
      max-width: none;
    }

    .dp-hero__image {
      width: 100%;
      max-width: none;
      max-height: none;
      height: auto;

      animation:
        heroReveal 0.8s ease-out both,
        heroFloatZoom 12s ease-in-out 1s infinite alternate;
    }

    .dp-hero__cta {
      right: 14px;
      bottom: 14px;

      min-height: 38px;
      padding: 0 15px;

      border-radius: 999px;

      font-size: 11.5px;
      font-weight: 800;

      background: rgba(255, 106, 19, 0.88);

      box-shadow:
        0 7px 18px rgba(75, 34, 12, 0.16);
    }
  }

  /* Teléfonos muy angostos */

  @media (max-width: 380px) {
    .dp-hero__cta {
      right: 10px;
      bottom: 10px;

      min-height: 36px;
      padding: 0 13px;

      font-size: 10.5px;
    }
  }

  /* =====================================================
     ACCESIBILIDAD
     ===================================================== */

  @media (prefers-reduced-motion: reduce) {
    .dp-hero__image,
    .dp-hero__cta {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>


<section class="dp-hero" aria-label="Digitalmente Pro">

  <div class="dp-hero__wrap">

    <div class="dp-hero__media">

      <div class="dp-hero__frame">

        <img
          class="dp-hero__image"
          src="https://raw.githubusercontent.com/digitalmenteepro-cell/digitalmenteprochile.cl/refs/heads/main/images/Portada%202.0.png"
          alt="Digitalmente Pro - Haz que tu marca se haga escuchar"
          loading="eager"
          fetchpriority="high"
        >

        <a
          class="dp-hero__cta"
          href="https://wa.me/56987689361?text=Hola%20%F0%9F%91%8B%20Quiero%20hacer%20crecer%20mi%20negocio%20con%20Digitalmente%20Pro."
          target="_blank"
          rel="noopener"
          aria-label="Quiero hacer crecer mi negocio por WhatsApp"
        >
          Quiero hacer crecer mi negocio
        </a>

      </div>

    </div>

  </div>

</section>
